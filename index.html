<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVI Design Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#F9F8F6;color:#161412;font-family:'Inter',-apple-system,sans-serif;font-weight:300;
    display:flex;align-items:center;justify-content:center;padding:2rem}
  .box{width:100%;max-width:22rem;text-align:center}
  .logo{width:9rem;height:3.6rem;margin:0 auto 2.6rem;background:#161412;
    -webkit-mask:url('assets/logo.svg') no-repeat center/contain;
    mask:url('assets/logo.svg') no-repeat center/contain}
  h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:1.5rem;margin-bottom:.6rem}
  p{color:#8B8A89;font-size:.88rem;line-height:1.6;margin-bottom:1.8rem}
  input{width:100%;padding:.85rem 1rem;border:1px solid #D8D8D8;border-radius:2px;background:#fff;
    font-family:inherit;font-size:.95rem;color:#161412;text-align:center;letter-spacing:.06em}
  input:focus{outline:none;border-color:#983A1F}
  button{width:100%;margin-top:.8rem;padding:.85rem;border:none;border-radius:2px;background:#161412;
    color:#fff;font-family:inherit;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  button:hover{background:#983A1F}
  .err{color:#983A1F;font-size:.8rem;margin-top:.9rem;height:1rem}
  .foot{margin-top:2.6rem;font-size:.65rem;letter-spacing:.28em;text-transform:uppercase;color:#B1B1B0}
</style>
</head>
<body>
<div class="box">
  <div class="logo"></div>
  <h1>Private presentation</h1>
  <p>Enter the access code you were given.</p>
  <form id="f">
    <input id="p" type="password" autocomplete="current-password" autofocus placeholder="Access code">
    <button type="submit">Enter</button>
  </form>
  <div class="err" id="e"></div>
  <div class="foot">AVI Design Studio</div>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(D.salt), iterations:D.it, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, key, b64(D.ct));
  return new TextDecoder().decode(plain);
}

function render(html){
  // Render the decrypted deck in a full-window srcdoc iframe. It inherits this
  // page's origin, so third-party embeds (Kuula, BIMx) load normally — a blob:
  // URL would give them an opaque origin and they'd refuse to frame.
  document.documentElement.style.cssText = "height:100%;margin:0";
  document.body.style.cssText = "height:100%;margin:0;padding:0;overflow:hidden;display:block";
  document.body.innerHTML = "";
  const f = document.createElement("iframe");
  f.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0";
  f.setAttribute("allow", "fullscreen; accelerometer; gyroscope");
  f.srcdoc = html;
  f.addEventListener("load", () => { try { f.contentWindow.focus(); } catch(_){} });
  document.body.appendChild(f);
  // keyboard control works even if focus is still on the outer document
  addEventListener("keydown", e => {
    if (!f.contentWindow) return;
    try { f.contentWindow.dispatchEvent(new KeyboardEvent("keydown", {key: e.key, bubbles: true})); } catch(_){}
  });
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("p").value.trim();
  const err = document.getElementById("e");
  err.textContent = "";
  try{
    const html = await unlock(pw);
    sessionStorage.setItem("avi_pw", pw);
    render(html);
  }catch(_){
    err.textContent = "Wrong code — try again.";
    document.getElementById("p").select();
  }
});

// re-open the deck automatically if the code was already entered this session
(async () => {
  const saved = sessionStorage.getItem("avi_pw");
  if(saved){ try{ render(await unlock(saved)); }catch(_){ sessionStorage.removeItem("avi_pw"); } }
})();
